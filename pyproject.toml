[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edel"
version = "0.1.0"
description = "Modular embedding-driven epistemic landscapes pipeline"
requires-python = ">=3.10"
dependencies = [
    "dotenv",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "hdbscan",
    "umap-learn",
    "pydiffmap",
    "plotly",
    "matplotlib",
    "seaborn",
    "kaleido>=1.2.0",
    "nbformat",
    "tqdm",
    "pyarrow",
    "requests",
    "POT",
    
    "nltk",
    "wordfreq",
    
    "openai", 
    "google-genai",
    "google-cloud-storage",
    
    "ijson",
    "python-dotenv",
    "dash>=2.17",
    "dash-bootstrap-components",
    "openpyxl",
]

[project.optional-dependencies]
robustness = [
    "spacy",
]

[tool.setuptools.packages.find]
include = ["edel*"]
